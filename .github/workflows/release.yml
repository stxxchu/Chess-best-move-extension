name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check that the tag matches the manifest version
        run: |
          version=$(node -p "require('./extension/manifest.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match manifest version $version"; exit 1; }
      - name: Build the ZIP
        run: |
          node scripts/pack.mjs
          cp dist/chess-hints-*.zip dist/chess-hints.zip
      - name: Publish the release
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Chess Hints $GITHUB_REF_NAME" --notes-file .github/release-notes.md --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
